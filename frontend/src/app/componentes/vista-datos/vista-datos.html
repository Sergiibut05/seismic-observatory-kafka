<section class="vista" [attr.aria-label]="i18n.tr('vista.aria')">
  <div class="vista__controles">
    <fieldset class="vista__modo">
      <legend>{{ i18n.tr('vista.leyenda') }}</legend>
      <div class="vista__opciones">
        <span class="vista__opcion">
          <input
            id="vista-modo-live"
            type="radio"
            name="vista-modo"
            value="live"
            [checked]="!esReplay()"
            (change)="elegirModo('live')"
          />
          <label for="vista-modo-live">{{ i18n.tr('vista.directo') }}</label>
        </span>
        <span class="vista__opcion vista__opcion--replay">
          <input
            id="vista-modo-replay"
            type="radio"
            name="vista-modo"
            value="replay"
            [checked]="esReplay()"
            (change)="elegirModo('replay')"
          />
          <label for="vista-modo-replay">{{ i18n.tr('vista.replay') }}</label>
        </span>
      </div>
    </fieldset>

    <div class="vista__sinteticos">
      <input
        id="vista-sinteticos"
        class="vista__interruptor"
        type="checkbox"
        role="switch"
        [checked]="sinteticos()"
        aria-describedby="vista-sinteticos-ayuda"
        (change)="alternarSinteticos($event)"
      />
      <label for="vista-sinteticos">{{ i18n.tr('vista.sinteticos') }}</label>
      <span class="vista__ayuda" id="vista-sinteticos-ayuda">
        {{ i18n.tr('vista.sinteticos_ayuda') }}
      </span>
    </div>
  </div>

  @if (esReplay()) {
    <div class="franja franja--replay" role="status">
      <div class="franja__interior">
        <strong class="franja__titulo">
          <span aria-hidden="true">⟲ </span>{{ i18n.tr('dominio.replay') }}
        </strong>
        <span class="franja__texto">
          {{ i18n.tr('vista.franja_replay') }}
        </span>
      </div>
    </div>
  }

  @if (sinteticos()) {
    <div class="franja franja--sinteticos" role="status">
      <div class="franja__interior">
        <span class="franja__texto">
          <strong><span aria-hidden="true">⚠ </span>{{ i18n.tr('vista.franja_sinteticos_a') }}</strong>
          {{ i18n.tr('vista.franja_sinteticos_b') }}
        </span>
      </div>
    </div>
  }
</section>
