<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
  <title id="t">Delivery guarantees</title>
  <desc id="d">Twelve steps highlighted one after another in three lanes. Producers fetch, send, wait for the Kafka ack and only then mark the version as published. The Spark fusion reads a micro-batch, decides with its state, writes the merged events to Kafka and only then saves its state. The consumer polls, validates, commits to PostgreSQL and only then commits the Kafka offset. A crash at the critical point replays the same work, and the idempotent write skips the duplicate.</desc>
  <style>
    .bg { fill: #0d1b2a; }
    .title { font: 700 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e8eef3; }
    .sub { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9fb3c4; }
    .lane { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8fbcd4; letter-spacing: .08em; }
    .lane.spark { fill: #f08a4b; }
    .step { fill: #132a40; stroke: #3c5a74; stroke-width: 1.5; animation: on 12s infinite; }
    .n { font: 700 12px ui-monospace, Consolas, monospace; fill: #ffd166; }
    .lbl { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e8eef3; }
    .cap { font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9fb3c4; }
    .arrow { stroke: #3c5a74; stroke-width: 2; marker-end: url(#a); }
    .warn { fill: #2a1d14; stroke: #ff6b3d; stroke-width: 1.5; }
    .warnt { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffd2c2; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; } .s4 { animation-delay: 3s; }
    .s5 { animation-delay: 4s; } .s6 { animation-delay: 5s; } .s7 { animation-delay: 6s; } .s8 { animation-delay: 7s; }
    .s9 { animation-delay: 8s; } .s10 { animation-delay: 9s; } .s11 { animation-delay: 10s; } .s12 { animation-delay: 11s; }
    @keyframes on {
      0%, 7% { fill: #1f4466; stroke: #ffd166; }
      9%, 100% { fill: #132a40; stroke: #3c5a74; }
    }
    @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3c5a74"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="470" rx="16"/>
  <text class="title" x="28" y="42">At-least-once delivery, written exactly once</text>
  <text class="sub" x="28" y="64">Each step only happens after the previous one is confirmed. Nothing is marked done before it is durable.</text>

  <text class="lane" x="28" y="100">PRODUCERS (USGS · EMSC)</text>
  <g>
    <rect class="step" x="28" y="110" width="215" height="62" rx="10"/>
    <text class="n" x="42" y="134">1</text><text class="lbl" x="58" y="134">Fetch the source</text>
    <text class="cap" x="42" y="154">keep only new (source, id, version)</text>
    <rect class="step s2" x="268" y="110" width="215" height="62" rx="10"/>
    <text class="n" x="282" y="134">2</text><text class="lbl" x="298" y="134">Send to its topic</text>
    <text class="cap" x="282" y="154">key = source id · acks = all</text>
    <rect class="step s3" x="508" y="110" width="215" height="62" rx="10"/>
    <text class="n" x="522" y="134">3</text><text class="lbl" x="538" y="134">Wait for the ack</text>
    <text class="cap" x="522" y="154">no ack &#8594; retry with backoff</text>
    <rect class="step s4" x="748" y="110" width="224" height="62" rx="10"/>
    <text class="n" x="762" y="134">4</text><text class="lbl" x="778" y="134">Mark as published</text>
    <text class="cap" x="762" y="154">result=publicado</text>
    <line class="arrow" x1="243" y1="141" x2="266" y2="141"/>
    <line class="arrow" x1="483" y1="141" x2="506" y2="141"/>
    <line class="arrow" x1="723" y1="141" x2="746" y2="141"/>
  </g>

  <text class="lane spark" x="28" y="204">FUSION (PYSPARK)</text>
  <g>
    <rect class="step s5" x="28" y="214" width="215" height="62" rx="10"/>
    <text class="n" x="42" y="238">5</text><text class="lbl" x="58" y="238">Read a micro-batch</text>
    <text class="cap" x="42" y="258">offsets kept in the checkpoint</text>
    <rect class="step s6" x="268" y="214" width="215" height="62" rx="10"/>
    <text class="n" x="282" y="238">6</text><text class="lbl" x="298" y="238">Decide with its state</text>
    <text class="cap" x="282" y="258">same quake? deterministic</text>
    <rect class="step s7" x="508" y="214" width="215" height="62" rx="10"/>
    <text class="n" x="522" y="238">7</text><text class="lbl" x="538" y="238">Write eventos.live</text>
    <text class="cap" x="522" y="258">key = canonical id · acks = all</text>
    <rect class="step s8" x="748" y="214" width="224" height="62" rx="10"/>
    <text class="n" x="762" y="238">8</text><text class="lbl" x="778" y="238">Save state, then offset</text>
    <text class="cap" x="762" y="258">COMMIT · checkpoint</text>
    <line class="arrow" x1="243" y1="245" x2="266" y2="245"/>
    <line class="arrow" x1="483" y1="245" x2="506" y2="245"/>
    <line class="arrow" x1="723" y1="245" x2="746" y2="245"/>
  </g>
  <rect class="warn" x="268" y="284" width="704" height="26" rx="8"/>
  <text class="warnt" x="282" y="302">Crash between 7 and 8? The batch replays, writes the same messages, and the consumer skips them.</text>

  <text class="lane" x="28" y="342">CONSUMER</text>
  <g>
    <rect class="step s9" x="28" y="352" width="215" height="62" rx="10"/>
    <text class="n" x="42" y="376">9</text><text class="lbl" x="58" y="376">Poll the message</text>
    <text class="cap" x="42" y="396">manual offset commit</text>
    <rect class="step s10" x="268" y="352" width="215" height="62" rx="10"/>
    <text class="n" x="282" y="376">10</text><text class="lbl" x="306" y="376">Validate and enrich</text>
    <text class="cap" x="282" y="396">schema · nulls · country polygon</text>
    <rect class="step s11" x="508" y="352" width="215" height="62" rx="10"/>
    <text class="n" x="522" y="376">11</text><text class="lbl" x="546" y="376">COMMIT in PostgreSQL</text>
    <text class="cap" x="522" y="396">one transaction per message</text>
    <rect class="step s12" x="748" y="352" width="224" height="62" rx="10"/>
    <text class="n" x="762" y="376">12</text><text class="lbl" x="786" y="376">Commit Kafka offset</text>
    <text class="cap" x="762" y="396">result=persistido</text>
    <line class="arrow" x1="243" y1="383" x2="266" y2="383"/>
    <line class="arrow" x1="483" y1="383" x2="506" y2="383"/>
    <line class="arrow" x1="723" y1="383" x2="746" y2="383"/>
  </g>
  <rect class="warn" x="388" y="424" width="584" height="26" rx="8"/>
  <text class="warnt" x="402" y="442">Crash between 11 and 12? The message comes back and the same (id, updated) is skipped.</text>
</svg>
