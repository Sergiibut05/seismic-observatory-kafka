<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
  <title id="t">Quick start in three commands</title>
  <desc id="d">A PowerShell terminal types three steps: create the .env file, start the five services with Docker Compose and start the Angular panel. Next to it, a browser window opens the panel: a world map with earthquakes and a small chart.</desc>
  <style>
    .bg { fill: #0d1b2a; }
    .term { fill: #08131e; stroke: #2e5577; stroke-width: 1.5; }
    .bar-t { fill: #132a40; }
    .title { font: 700 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e8eef3; }
    .c { font: 400 13px ui-monospace, Consolas, "Cascadia Mono", monospace; fill: #e8eef3; white-space: pre; }
    .p { fill: #8fbcd4; }
    .k { fill: #9fb3c4; }
    .g { fill: #8fd694; }
    .y { fill: #ffd166; }
    .line { opacity: 0; animation: type 14s ease-out infinite; }
    .l2 { animation-name: type2; } .l3 { animation-name: type3; } .l4 { animation-name: type4; }
    .l5 { animation-name: type5; } .l6 { animation-name: type6; }
    @keyframes type  { 0% { opacity: 0; } 8%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes type2 { 0%, 14% { opacity: 0; } 24%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes type3 { 0%, 30% { opacity: 0; } 31%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes type4 { 0%, 40% { opacity: 0; } 52%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes type5 { 0%, 58% { opacity: 0; } 59%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes type6 { 0%, 64% { opacity: 0; } 65%, 95% { opacity: 1; } 100% { opacity: 0; } }

    /* The panel window: paper theme, as the app opens by default */
    .win { fill: #f4f1ea; stroke: #2e5577; stroke-width: 1.5; }
    .chrome { fill: #e6e0d3; }
    .url { fill: #fbf9f4; }
    .ui { font: 400 9px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5c574e; }
    .brand { font: 600 12.5px Georgia, "Times New Roman", serif; fill: #1a1a1a; }
    .card { fill: #fbf9f4; stroke: #d9d2c3; }
    .sea { fill: #c5d1cf; }
    .land { fill: #f7f3ea; stroke: #6f685c; stroke-width: .35; stroke-linejoin: round; }
    .ev { stroke: #1a1a1a; stroke-width: .6; }
    .pulse { fill: none; stroke: #c8102e; stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { from { transform: scale(.3); opacity: 1; } to { transform: scale(1); opacity: 0; } }
    .num { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a1a1a; }
    .bar { fill: #3f7f86; transform-box: fill-box; transform-origin: 50% 100%; animation: grow 14s cubic-bezier(.2, .8, .2, 1) infinite both; }
    .hi { fill: #1d4f55; }
    @keyframes grow { 0%, 62% { transform: scaleY(0); } 70%, 100% { transform: scaleY(1); } }
    .panel { opacity: 0; animation: open 14s ease-out infinite; transform-box: fill-box; transform-origin: 50% 60%; }
    @keyframes open { 0%, 58% { opacity: 0; transform: scale(.97); } 63%, 95% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .line, .panel { animation: none; opacity: 1; }
      .pulse, .bar { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="map"><rect width="264" height="132" rx="5"/></clipPath>
  </defs>

  <rect class="bg" width="1000" height="330" rx="16"/>
  <text class="title" x="28" y="42">Run it locally</text>

  <rect class="term" x="28" y="62" width="600" height="244" rx="10"/>
  <rect class="bar-t" x="29" y="63" width="598" height="26" rx="9"/>
  <circle cx="46" cy="76" r="5" fill="#ff6b3d"/><circle cx="62" cy="76" r="5" fill="#ffd166"/><circle cx="78" cy="76" r="5" fill="#8fd694"/>
  <text class="c k" x="98" y="80" style="font-size:11px">PowerShell · repository root</text>

  <text class="c line" x="44" y="118"><tspan class="p">PS&gt; </tspan>Copy-Item .env.example .env   <tspan class="k"># set POSTGRES_PASSWORD</tspan></text>
  <text class="c line l2" x="44" y="148"><tspan class="p">PS&gt; </tspan>docker compose up --build -d</text>
  <text class="c line l3" x="44" y="174"><tspan class="g">  &#10004; kafka  &#10004; postgres  &#10004; producer  &#10004; consumer  &#10004; api</tspan>   <tspan class="k">healthy</tspan></text>
  <text class="c line l4" x="44" y="210"><tspan class="p">PS&gt; </tspan>cd frontend; npm ci; npm start</text>
  <text class="c line l5" x="44" y="236"><tspan class="g">  &#10140; </tspan>Local: <tspan class="y">http://localhost:4200</tspan></text>
  <text class="c line l6" x="44" y="276"><tspan class="k">  Live USGS data every 60 s · flat map or 3D globe · paper or night</tspan></text>

  <!-- Browser window with the panel -->
  <g class="panel">
