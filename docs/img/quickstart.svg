    <circle cx="668" cy="76" r="4" fill="#b9b1a2"/><circle cx="681" cy="76" r="4" fill="#b9b1a2"/><circle cx="694" cy="76" r="4" fill="#b9b1a2"/>
    <rect class="url" x="708" y="68" width="170" height="16" rx="8"/>
    <text class="ui" x="718" y="79.5">localhost:4200</text>

    <text class="brand" x="666" y="109">Seismic activity observatory</text>
