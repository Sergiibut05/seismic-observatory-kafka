<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d">
  <title id="t">Seismic Activity Observatory: data flow</title>
  <desc id="d">Two sources, USGS and EMSC, each with its own producer and Kafka topic. A PySpark fusion service merges reports of the same earthquake and writes to eventos.live; from there the consumer, PostgreSQL, the API, the ngrok tunnel and the Angular panel. The 2025-2026 backfill feeds the source topics; the replay and the Natural Earth country catalogue join the consumer. Animated dots represent messages.</desc>
  <style>
    .bg { fill: #0d1b2a; }
    .box { fill: #132a40; stroke: #3c5a74; stroke-width: 1.5; }
    .box.hi { stroke: #ffb347; }
    .box.spark { stroke: #e25a1c; fill: #1d2433; }
    .box.side { fill: #102233; stroke-dasharray: 5 4; }
    .name { font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e8eef3; text-anchor: middle; }
    .cap { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9fb3c4; text-anchor: middle; }
    .title { font: 700 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e8eef3; }
    .sub { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9fb3c4; }
    .topic { fill: #173350; stroke: #2e5577; }
    .topict { font: 600 11px ui-monospace, Consolas, "Cascadia Mono", monospace; fill: #cfe0ec; text-anchor: middle; }
    .chip { fill: #173350; stroke: #2e5577; }
    .chipt { font: 600 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #cfe0ec; text-anchor: middle; }
    .wire { fill: none; stroke: #3c5a74; stroke-width: 2; }
    .wire.side { stroke: #7a5a2e; stroke-dasharray: 6 5; }
    .wire.geo { stroke: #3e6b5c; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #8fbcd4; stroke-width: 2; stroke-dasharray: 4 14; animation: dash 1.2s linear infinite; }
    .pulse { fill: none; stroke: #ff6b3d; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .pulse.b { animation-delay: 1.2s; }
    @keyframes dash { to { stroke-dashoffset: -18; } }
    @keyframes ring { from { transform: scale(0.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } .msg { display: none; } }
  </style>

  <rect class="bg" width="1000" height="480" rx="16"/>
  <text class="title" x="28" y="40">How an earthquake reaches the map</text>
  <text class="sub" x="28" y="62">Two sources, one topic each. Spark merges reports of the same earthquake; the rest of the pipeline is unchanged.</text>

  <!-- rutas de los mensajes -->
  <path id="ruta-usgs" d="M75 126 H455 V171 H660 V311 H75 V350 H595" fill="none"/>
  <path id="ruta-emsc" d="M75 216 H455 V171 H660 V311 H75 V350 H595" fill="none"/>

  <!-- cables -->
  <path class="wire" d="M130 126 H312 M130 216 H312 M428 126 H455 V216 H428 M455 171 H480 M610 171 H650 M660 201 V311 H75 V320 M130 350 H540"/>
  <path class="flow" d="M130 126 H312 M130 216 H312 M455 171 H480 M610 171 H650 M660 201 V311 H75 V320 M130 350 H540"/>
  <path class="wire side" d="M270 282 H370 V256"/>
  <path class="wire side" d="M75 410 V380"/>
  <path class="wire geo" d="M150 430 H105 V380"/>

  <!-- fuentes y productores -->
  <g>
    <rect class="box hi" x="20" y="96" width="110" height="60" rx="10"/>
    <circle class="pulse" cx="38" cy="111" r="7"/><circle cx="38" cy="111" r="3" fill="#ff6b3d"/>
    <text class="name" x="75" y="123">USGS</text>
    <text class="cap" x="75" y="140">all_day.geojson</text>
  </g>
  <g>
    <rect class="box hi" x="20" y="186" width="110" height="60" rx="10"/>
    <circle class="pulse b" cx="38" cy="201" r="7"/><circle cx="38" cy="201" r="3" fill="#ff6b3d"/>
    <text class="name" x="75" y="213">EMSC</text>
    <text class="cap" x="75" y="230">FDSN · last 26 h</text>
  </g>
  <g>
    <rect class="box" x="160" y="96" width="110" height="60" rx="10"/>
    <text class="name" x="215" y="120">producer</text>
    <text class="cap" x="215" y="137">every 60 s · new or</text>
    <text class="cap" x="215" y="150">revised only</text>
  </g>
  <g>
    <rect class="box" x="160" y="186" width="110" height="60" rx="10"/>
    <text class="name" x="215" y="210">producer-emsc</text>
    <text class="cap" x="215" y="227">same image,</text>
    <text class="cap" x="215" y="240">other source</text>
  </g>
  <g>
    <rect class="box side" x="160" y="262" width="110" height="40" rx="10"/>
    <text class="name" x="215" y="280" style="font-size:12px">backfill</text>
    <text class="cap" x="215" y="294">2025–2026 · M ≥ 2.5</text>
  </g>

  <!-- Kafka: topics por fuente -->
  <g>
    <rect class="box" x="300" y="86" width="140" height="170" rx="10"/>
    <text class="name" x="370" y="106">Kafka 4.1</text>
    <rect class="topic" x="312" y="114" width="116" height="24" rx="12"/>
    <text class="topict" x="370" y="130">eventos.usgs</text>
    <text class="cap" x="370" y="164">one topic per source</text>
    <text class="cap" x="370" y="178">key = source id</text>
    <rect class="topic" x="312" y="204" width="116" height="24" rx="12"/>
    <text class="topict" x="370" y="220">eventos.emsc</text>
  </g>

  <!-- fusión -->
  <g>
    <rect class="box spark" x="480" y="134" width="130" height="74" rx="10"/>
    <text class="name" x="545" y="156">fusion</text>
    <text class="cap" x="545" y="173">PySpark streaming</text>
    <text class="cap" x="545" y="187">same quake if ≤ 30 s</text>
    <text class="cap" x="545" y="200">and ≤ 100 km apart</text>
  </g>
  <g>
    <rect class="box" x="650" y="141" width="140" height="60" rx="10"/>
    <text class="name" x="720" y="163">Kafka</text>
    <rect class="topic" x="664" y="171" width="112" height="22" rx="11"/>
    <text class="topict" x="720" y="186">eventos.live</text>
  </g>
  <text class="cap" x="800" y="163" style="text-anchor:start">merged event,</text>
  <text class="cap" x="800" y="177" style="text-anchor:start">key = canonical id</text>
  <text class="cap" x="800" y="191" style="text-anchor:start">sources: [emsc, usgs]</text>

  <!-- fila de abajo: el camino de siempre -->
  <g>
    <rect class="box" x="20" y="320" width="110" height="60" rx="10"/>
    <text class="name" x="75" y="343">consumer</text>
    <text class="cap" x="75" y="360">validate · quarantine</text>
    <text class="cap" x="75" y="373">point-in-polygon</text>
  </g>
  <g>
    <rect class="box" x="150" y="320" width="110" height="60" rx="10"/>
    <text class="name" x="205" y="343">PostgreSQL</text>
    <text class="cap" x="205" y="360">current state</text>
    <text class="cap" x="205" y="373">+ history + fusion state</text>
  </g>
  <g>
    <rect class="box" x="280" y="320" width="110" height="60" rx="10"/>
    <text class="name" x="335" y="343">API</text>
    <text class="cap" x="335" y="360">FastAPI · read-only</text>
    <text class="cap" x="335" y="373">127.0.0.1:8000</text>
  </g>
  <g>
    <rect class="box" x="410" y="320" width="110" height="60" rx="10"/>
    <text class="name" x="465" y="343">ngrok</text>
    <text class="cap" x="465" y="360">HTTPS tunnel</text>
    <text class="cap" x="465" y="373">API only</text>
  </g>
  <g>
    <rect class="box hi" x="540" y="320" width="110" height="60" rx="10"/>
    <text class="name" x="595" y="343">Panel</text>
    <text class="cap" x="595" y="360">Angular · Netlify</text>
    <text class="cap" x="595" y="373">2D map + 3D globe</text>
  </g>
  <g>
    <rect class="box side" x="20" y="410" width="110" height="44" rx="10"/>
    <text class="name" x="75" y="429" style="font-size:12px">replay 2025</text>
    <text class="cap" x="75" y="444">eventos.replay</text>
  </g>
  <g>
    <rect class="box side" x="150" y="410" width="110" height="44" rx="10"/>
    <text class="name" x="205" y="429" style="font-size:12px">Natural Earth</text>
    <text class="cap" x="205" y="444">242 countries</text>
  </g>

  <!-- mensajes -->
  <g class="msg">
    <circle r="5" fill="#ffd166"><animateMotion dur="9s" repeatCount="indefinite" begin="0s"><mpath href="#ruta-usgs"/></animateMotion></circle>
    <circle r="5" fill="#8fd694"><animateMotion dur="9s" repeatCount="indefinite" begin="0.4s"><mpath href="#ruta-emsc"/></animateMotion></circle>
    <circle r="5" fill="#ffd166"><animateMotion dur="9s" repeatCount="indefinite" begin="3s"><mpath href="#ruta-usgs"/></animateMotion></circle>
    <circle r="5" fill="#8fd694"><animateMotion dur="9s" repeatCount="indefinite" begin="6s"><mpath href="#ruta-emsc"/></animateMotion></circle>
  </g>

  <!-- garantías -->
  <g>
    <rect class="chip" x="670" y="300" width="320" height="26" rx="13"/>
    <text class="chipt" x="830" y="317">Published only after the Kafka ack</text>
    <rect class="chip" x="670" y="334" width="320" height="26" rx="13"/>
    <text class="chipt" x="830" y="351">Spark writes to Kafka before saving its state</text>
    <rect class="chip" x="670" y="368" width="320" height="26" rx="13"/>
    <text class="chipt" x="830" y="385">Offset committed after the PostgreSQL COMMIT</text>
    <rect class="chip" x="670" y="402" width="320" height="26" rx="13"/>
    <text class="chipt" x="830" y="419">Country from coordinates, never from text</text>
    <rect class="chip" x="670" y="436" width="320" height="26" rx="13"/>
    <text class="chipt" x="830" y="453">Missing stays missing · bad ones to quarantine</text>
  </g>
</svg>
