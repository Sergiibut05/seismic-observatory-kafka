<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d">
  <title id="t">Seismic Activity Observatory: data flow</title>
  <desc id="d">USGS feed, producer, Kafka, consumer, PostgreSQL, API, ngrok tunnel and Angular panel, with the 2025 replay and the Natural Earth country catalogue feeding in from below. Animated dots represent messages.</desc>
  <style>
    .bg { fill: #0d1b2a; }
    .box { fill: #132a40; stroke: #3c5a74; stroke-width: 1.5; }
    .box.hi { stroke: #ffb347; }
    .box.side { fill: #102233; stroke-dasharray: 5 4; }
    .name { font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e8eef3; text-anchor: middle; }
    .cap { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9fb3c4; text-anchor: middle; }
    .title { font: 700 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e8eef3; }
    .sub { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9fb3c4; }
    .chip { fill: #173350; stroke: #2e5577; }
    .chipt { font: 600 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #cfe0ec; text-anchor: middle; }
    .wire { fill: none; stroke: #3c5a74; stroke-width: 2; }
    .wire.replay { stroke: #7a5a2e; stroke-dasharray: 6 5; }
    .wire.geo { stroke: #3e6b5c; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #8fbcd4; stroke-width: 2; stroke-dasharray: 4 14; animation: dash 1.2s linear infinite; }
    .pulse { fill: none; stroke: #ff6b3d; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .pulse.b { animation-delay: 1.2s; }
    @keyframes dash { to { stroke-dashoffset: -18; } }
    @keyframes ring { from { transform: scale(0.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } .msg { display: none; } }
  </style>

  <rect class="bg" width="1000" height="420" rx="16"/>
  <text class="title" x="28" y="42">How an earthquake reaches the map</text>
  <text class="sub" x="28" y="64">Each dot is a Kafka message. Live data follows the top row; the 2025 replay and the country catalogue join from below.</text>

  <!-- cables -->
  <path id="main" class="wire" d="M115 158 H885"/>
  <path class="flow" d="M115 158 H885"/>
  <path id="rep" class="wire replay" d="M115 318 H135 M240 318 H312.5 V196"/>
  <path id="repm" d="M240 318 H312.5 V196" fill="none"/>
  <path class="wire geo" d="M437.5 290 V196"/>

  <!-- fila principal -->
  <g>
    <rect class="box hi" x="10" y="118" width="105" height="78" rx="10"/>
    <circle class="pulse" cx="62.5" cy="137" r="9"/>
    <circle class="pulse b" cx="62.5" cy="137" r="9"/>
    <circle cx="62.5" cy="137" r="3.5" fill="#ff6b3d"/>
    <text class="name" x="62.5" y="164">USGS</text>
    <text class="cap" x="62.5" y="180">all_day.geojson</text>
  </g>
  <g>
    <rect class="box" x="135" y="118" width="105" height="78" rx="10"/>
    <text class="name" x="187.5" y="146">producer</text>
    <text class="cap" x="187.5" y="164">polls every 60 s</text>
    <text class="cap" x="187.5" y="178">new or revised only</text>
  </g>
  <g>
    <rect class="box" x="260" y="118" width="105" height="78" rx="10"/>
    <text class="name" x="312.5" y="146">Kafka 4.1</text>
    <text class="cap" x="312.5" y="164">KRaft · 3 partitions</text>
    <text class="cap" x="312.5" y="178">key = USGS id</text>
  </g>
  <g>
    <rect class="box" x="385" y="118" width="105" height="78" rx="10"/>
    <text class="name" x="437.5" y="146">consumer</text>
    <text class="cap" x="437.5" y="164">validate · quarantine</text>
    <text class="cap" x="437.5" y="178">point-in-polygon</text>
  </g>
  <g>
    <rect class="box" x="510" y="118" width="105" height="78" rx="10"/>
    <text class="name" x="562.5" y="146">PostgreSQL</text>
    <text class="cap" x="562.5" y="164">current state</text>
    <text class="cap" x="562.5" y="178">+ version history</text>
  </g>
  <g>
    <rect class="box" x="635" y="118" width="105" height="78" rx="10"/>
    <text class="name" x="687.5" y="146">API</text>
    <text class="cap" x="687.5" y="164">FastAPI · read-only</text>
    <text class="cap" x="687.5" y="178">127.0.0.1:8000</text>
  </g>
  <g>
    <rect class="box" x="760" y="118" width="105" height="78" rx="10"/>
    <text class="name" x="812.5" y="146">ngrok</text>
    <text class="cap" x="812.5" y="164">HTTPS tunnel</text>
    <text class="cap" x="812.5" y="178">API only</text>
  </g>
  <g>
    <rect class="box hi" x="885" y="118" width="105" height="78" rx="10"/>
    <text class="name" x="937.5" y="146">Panel</text>
    <text class="cap" x="937.5" y="164">Angular · Netlify</text>
    <text class="cap" x="937.5" y="178">2D map + 3D globe</text>
  </g>

  <!-- fila inferior -->
  <g>
    <rect class="box side" x="10" y="290" width="105" height="56" rx="10"/>
    <text class="name" x="62.5" y="313">USGS FDSN</text>
    <text class="cap" x="62.5" y="330">2025, M &#8805; 4</text>
  </g>
  <g>
    <rect class="box side" x="135" y="290" width="105" height="56" rx="10"/>
    <text class="name" x="187.5" y="313">replay</text>
    <text class="cap" x="187.5" y="330">eventos.replay</text>
  </g>
  <g>
    <rect class="box side" x="385" y="290" width="105" height="56" rx="10"/>
    <text class="name" x="437.5" y="313">Natural Earth</text>
    <text class="cap" x="437.5" y="330">242 countries · ADM0_A3</text>
  </g>
  <text class="cap" x="312.5" y="240" style="text-anchor:start">&#8592; REPLAY topic,</text>
  <text class="cap" x="312.5" y="254" style="text-anchor:start">   own schema</text>

  <!-- mensajes -->
  <g class="msg">
    <circle r="5" fill="#ffd166"><animateMotion dur="6s" repeatCount="indefinite" begin="0s"><mpath href="#main"/></animateMotion></circle>
    <circle r="5" fill="#ffd166"><animateMotion dur="6s" repeatCount="indefinite" begin="2s"><mpath href="#main"/></animateMotion></circle>
    <circle r="5" fill="#ffd166"><animateMotion dur="6s" repeatCount="indefinite" begin="4s"><mpath href="#main"/></animateMotion></circle>
    <circle r="4.5" fill="#ffb347"><animateMotion dur="3s" repeatCount="indefinite" begin="1s"><mpath href="#repm"/></animateMotion></circle>
  </g>

  <!-- garantías -->
  <g>
    <rect class="chip" x="560" y="268" width="420" height="26" rx="13"/>
    <text class="chipt" x="770" y="285">Published only after the Kafka ack</text>
    <rect class="chip" x="560" y="302" width="420" height="26" rx="13"/>
    <text class="chipt" x="770" y="319">Offset committed only after the PostgreSQL COMMIT</text>
    <rect class="chip" x="560" y="336" width="420" height="26" rx="13"/>
    <text class="chipt" x="770" y="353">Country from coordinates, never parsed from the place text</text>
    <rect class="chip" x="560" y="370" width="420" height="26" rx="13"/>
    <text class="chipt" x="770" y="387">Missing values stay missing · bad messages go to quarantine</text>
  </g>
</svg>
