[build]
  base = "frontend"
  command = "test -n \"$API_BASE_URL\" && printf '{\"apiBaseUrl\":\"%s\"}' \"$API_BASE_URL\" > public/config.json && npm ci && npm run build"
  publish = "dist/panel/browser"

[build.environment]
  NODE_VERSION = "22.14.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "no-cache"
